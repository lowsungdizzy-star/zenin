name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Используем Ubuntu 22.04, она самая стабильная для этих целей

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update --fix-missing
          # Установка базовых зависимостей по одной группе для надежности
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          sudo apt-get install -y python3-pip autoconf libtool pkg-config
          sudo apt-get install -y zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
          sudo apt-get install -y cmake libffi-dev libssl-dev build-essential
          sudo apt-get install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Build APK
        run: |
          # Принимаем лицензии и запускаем сборку с подробным логом
          yes | buildozer -v android debug
        env:
          # Отключаем предупреждения Node.js, чтобы они не мешали логам
          NODE_OPTIONS: "--no-deprecation"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenin-APK
          path: bin/*.apk
          
