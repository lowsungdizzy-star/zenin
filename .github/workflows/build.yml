name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Устанавливаем JDK 17 напрямую из стандартных репозиториев (без проблемных PPA)
          sudo apt-get install -y openjdk-17-jdk
          sudo apt-get install -y \
            git zip unzip \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          # Фиксируем версию Cython, чтобы избежать ошибок компиляции Kivy
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Build APK
        run: |
          # Автоматически принимаем лицензии и запускаем сборку
          yes | buildozer -v android debug
        env:
          # Помогаем Buildozer найти Java
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenin-APK
          path: bin/*.apk
          
